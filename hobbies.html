<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hobbies &amp; Interests - Kim Mendoza</title>
    <link rel="stylesheet" href="styles/style.css" type="text/css">
</head>
<body>
    <div class="container">
        <div class="gallery-card">
            <h1>Hobbies &amp; Interests</h1>
            <div class="gallery-container">
                <div id="hobbies" class="album-content active">
                    <h3 class="album-title">Bar graph based on my interest level</h3>
                    <div class="hobby-bars">
                        <div class="hobby-bar" style="--love-level: 84%;">
                            <span class="hobby-label">Photography</span>
                            <div class="hobby-meter">
                                <div class="hobby-meter-fill"></div>
                            </div>
                            <span class="hobby-score">84%</span>
                        </div>
                        <div class="hobby-bar" style="--love-level: 90%;">
                            <span class="hobby-label">Videography</span>
                            <div class="hobby-meter">
                                <div class="hobby-meter-fill"></div>
                            </div>
                            <span class="hobby-score">90%</span>
                        </div>
                        <div class="hobby-bar" style="--love-level: 72%;">
                            <span class="hobby-label">Photo Editing</span>
                            <div class="hobby-meter">
                                <div class="hobby-meter-fill"></div>
                            </div>
                            <span class="hobby-score">72%</span>
                        </div>
                        <div class="hobby-bar" style="--love-level: 99%;">
                            <span class="hobby-label">Video Editing</span>
                            <div class="hobby-meter">
                                <div class="hobby-meter-fill"></div>
                            </div>
                            <span class="hobby-score">99%</span>
                        </div>
                        <div class="hobby-bar" style="--love-level: 90%;">
                            <span class="hobby-label">Programming</span>
                            <div class="hobby-meter">
                                <div class="hobby-meter-fill"></div>
                            </div>
                            <span class="hobby-score">90%</span>
                        </div>
                        <div class="hobby-bar" style="--love-level: 100%;">
                            <span class="hobby-label">3D Modeling</span>
                            <div class="hobby-meter">
                                <div class="hobby-meter-fill"></div>
                            </div>
                            <span class="hobby-score">100%</span>
                        </div>
                        <div class="hobby-bar" style="--love-level: 65%;">
                            <span class="hobby-label">Playing Guitar</span>
                            <div class="hobby-meter">
                                <div class="hobby-meter-fill"></div>
                            </div>
                            <span class="hobby-score">65%</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="nav-container">
            <div class="main-nav">
                <h2 class="visually-hidden">Main navigation</h2>
                <a href="index.html" class="nav-item" title="Home">
                    <img src="assets/home.png" alt="Home">
                    <span>Home</span>

                <a href="gallery.html" class="nav-item" title="Gallery">
                    <img src="assets/picture.png" alt="Gallery">
                    <span>Gallery</span>
                </a>
                <a href="hobbies.html" class="nav-item" title="Hobbies">
                    <img src="assets/more.png" alt="Hobbies">
                    <span>Hobbies</span>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
