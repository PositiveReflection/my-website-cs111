<!DOCTYPE html>
<html>
<head>
    <title>Personal Profile - Kim Mendoza</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <div class="container">
        <h1>Personal Profile</h1>
        <!-- Profile content will go here -->
    </div>
    <nav class="top-nav">
    <div class="nav-container">
        <a href="index.html" class="nav-item">
            <img src="assets/home.png" alt="Home" class="nav-icon">
            <span>Home</span>
        </a>
        <a href="profile.html" class="nav-item active">
            <img src="assets/account.png" alt="Profile" class="nav-icon">
            <span>Profile</span>
        </a>
        <a href="#" class="nav-item">
            <img src="assets/picture.png" alt="Gallery" class="nav-icon">
            <span>Gallery</span>
        </a>
        <a href="hobbies.html" class="nav-item">
            <img src="assets/more.png" alt="Hobbies" class="nav-icon">
            <span>Hobbies</span>
        </a>
    </div>
</nav>

<style>
    .top-nav {
        background-color: #2c3e50;
        padding: 15px 0;
        position: fixed;
        top: 0;
        width: 100%;
        z-index: 1000;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    
    .nav-container {
        display: flex;
        justify-content: space-around;
        max-width: 800px;
        margin: 0 auto;
        padding: 0 20px;
    }
    
    .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        color: #ecf0f1;
        text-decoration: none;
        font-size: 14px;
        transition: all 0.3s ease;
        padding: 5px 15px;
        border-radius: 20px;
    }
    
    .nav-item:hover {
        background-color: #34495e;
        transform: translateY(-2px);
    }
    
    .nav-item.active {
        background-color: #3498db;
    }
    
    .nav-icon {
        width: 24px;
        height: 24px;
        margin-bottom: 5px;
    }
    
    /* Add padding to the top of the body to prevent content from being hidden behind the fixed navbar */
    body {
        padding-top: 80px;
    }
</style>
</body>
</html>
