<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Kim Mendoza</title>
    <link rel="stylesheet" href="styles/style.css" type="text/css">
</head>
<body>
    <div class="container">
        <div class="gallery-card">
            <h1>Gallery</h1>
            <div class="gallery-container">
                <div class="album-tabs">
                    <button class="album-tab active" onclick="document.querySelectorAll('.album-content').forEach(el => el.classList.remove('active')); document.getElementById('graduation').classList.add('active'); this.classList.add('active'); document.querySelectorAll('.album-tab').forEach(btn => btn.classList.remove('active')); this.classList.add('active');">Graduation</button>
                    <button class="album-tab" onclick="document.querySelectorAll('.album-content').forEach(el => el.classList.remove('active')); document.getElementById('ojt').classList.add('active'); this.classList.add('active'); document.querySelectorAll('.album-tab').forEach(btn => btn.classList.remove('active')); this.classList.add('active');">OJT</button>
                    <button class="album-tab" onclick="document.querySelectorAll('.album-content').forEach(el => el.classList.remove('active')); document.getElementById('research').classList.add('active'); this.classList.add('active'); document.querySelectorAll('.album-tab').forEach(btn => btn.classList.remove('active')); this.classList.add('active');">Research</button>
                    <button class="album-tab" onclick="document.querySelectorAll('.album-content').forEach(el => el.classList.remove('active')); document.getElementById('retreat').classList.add('active'); this.classList.add('active'); document.querySelectorAll('.album-tab').forEach(btn => btn.classList.remove('active')); this.classList.add('active');">Retreat</button>
                </div>
                
                <!-- Graduation Album -->
                <div id="graduation" class="album-content active">
                    <h3 class="album-title">Graduation</h3>
                    <img src="pictures/graduation/7XnyL4aO.jpg" alt="Graduation Photo 1" class="gallery-image">
                    <img src="pictures/graduation/8lk7ccq4.jpg" alt="Graduation Photo 2" class="gallery-image">
                    <img src="pictures/graduation/EpbarLC5.jpg" alt="Graduation Photo 3" class="gallery-image">
                    <img src="pictures/graduation/GtS2yEEz.jpg" alt="Graduation Photo 4" class="gallery-image">
                    <img src="pictures/graduation/MzVhcSW6.jpg" alt="Graduation Photo 5" class="gallery-image">
                    <img src="pictures/graduation/SH3I8zUd.jpg" alt="Graduation Photo 6" class="gallery-image">
                    <img src="pictures/graduation/TkDBaz3b.jpg" alt="Graduation Photo 7" class="gallery-image">
                    <img src="pictures/graduation/Uevsp4QJ.jpg" alt="Graduation Photo 8" class="gallery-image">
                    <img src="pictures/graduation/XZVhEV9Y.jpg" alt="Graduation Photo 9" class="gallery-image">
                    <img src="pictures/graduation/bvFv7jA0.jpg" alt="Graduation Photo 10" class="gallery-image">
                    <img src="pictures/graduation/h1Izwhw9.jpg" alt="Graduation Photo 11" class="gallery-image">
                    <img src="pictures/graduation/hTp8REet.jpg" alt="Graduation Photo 12" class="gallery-image">
                    <!-- <img src="pictures/graduation/mnuMcOSQ.jpg" alt="Graduation Photo 13" class="gallery-image"> -->
                </div>
                
                <!-- OJT Album -->
                <div id="ojt" class="album-content">
                    <h3 class="album-title">OJT</h3>
                    <img src="pictures/ojt/2eNk1-aq.jpg" alt="OJT Photo 1" class="gallery-image">
                    <img src="pictures/ojt/4I31POF0.jpg" alt="OJT Photo 2" class="gallery-image">
                    <img src="pictures/ojt/FE9sPHpW.jpg" alt="OJT Photo 3" class="gallery-image">
                    <img src="pictures/ojt/Ifywz9B_.jpg" alt="OJT Photo 4" class="gallery-image">
                    <img src="pictures/ojt/cEkPxLpD.jpg" alt="OJT Photo 5" class="gallery-image">
                </div>
                
                <!-- Research Album -->
                <div id="research" class="album-content">
                    <h3 class="album-title">Research</h3>
                    <img src="pictures/research/8fbKi123.jpg" alt="Research Photo 1" class="gallery-image">
                    <img src="pictures/research/9_roSyJR.jpg" alt="Research Photo 2" class="gallery-image">
                    <img src="pictures/research/TrTBwyVb.jpg" alt="Research Photo 3" class="gallery-image">
                    <img src="pictures/research/WM7JHiVO.jpg" alt="Research Photo 4" class="gallery-image">
                    <img src="pictures/research/f56eBfSE.jpg" alt="Research Photo 5" class="gallery-image">
                    <img src="pictures/research/jHINcpyj.jpg" alt="Research Photo 6" class="gallery-image">
                    <img src="pictures/research/kMml5tD6.jpg" alt="Research Photo 7" class="gallery-image">
                    <img src="pictures/research/o8VE_IEl.jpg" alt="Research Photo 8" class="gallery-image">

                <!-- Retreat Album -->

                    <img src="pictures/retreat/C-_D3z9g.jpg" alt="Retreat Photo 7" class="gallery-image">
                    <img src="pictures/retreat/52LDkWCv.jpg" alt="Retreat Photo 8" class="gallery-image">
                </div>
