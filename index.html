<body>
    <div class="container">
        <div class="profile-card">
            <img src="assets/newpfp3.png" alt="Kim Mendoza" class="profile-img">
            <h1>Kim Mendoza</h1>
            <p class="title">I'm a <span class="typewriter-text"></span><span class="cursor">|</span></p>
        </div>
        
        <div class="nav-container">
            <nav class="main-nav">
                <a href="index.html" class="nav-item" title="Home">
                    <img src="assets/home.png" alt="Home">
                    <span>Home</span>
                </a>
                <a href="profile.html" class="nav-item" title="Profile">
                    <img src="assets/account.png" alt="Profile">
                    <span>Profile</span>
                </a>
                <a href="gallery.html" class="nav-item" title="Gallery">
                    <img src="assets/picture.png" alt="Gallery">

                <a href="hobbies.html" class="nav-item" title="Hobbies">
                    <img src="assets/more.png" alt="Hobbies">
                    <span>Hobbies</span>
                </a>
            </nav>
        </div>

        <script> // Typewriter effect
            let words = ["Student", "Future Quant Developer", "Video Editor", "Photo Editor", "Photographer", "Videographer", "3D Modeler"];
            let wordIndex = 0;
            let charIndex = 0;
            let isDeleting = false;
            let typeSpeed = 100; 
            let deleteSpeed = 50; 
            let waitTime = 2000; 
            
            function typeWriter() {
                let currentWord = words[wordIndex];
                let display = document.querySelector('.typewriter-text');
                
                if (isDeleting) {
                    display.textContent = currentWord.substring(0, charIndex - 1);
                    charIndex--;
                    
                    if (charIndex === 0) {
                        isDeleting = false;
                        wordIndex = (wordIndex + 1) % words.length;
                        setTimeout(typeWriter, 500);
                        return;
                    }
                } else {
                    display.textContent = currentWord.substring(0, charIndex + 1);
                    charIndex++;
                    
                    if (charIndex === currentWord.length) {
                        isDeleting = true;
                        setTimeout(typeWriter, waitTime)
                        return;
                    }
                }
                
                setTimeout(typeWriter, isDeleting ? deleteSpeed : typeSpeed);
            }

            window.onload = function() {
                setTimeout(typeWriter, 1000); 
            };
        </script>
        <p>lol</p>

    </div>
</body>
</html>
